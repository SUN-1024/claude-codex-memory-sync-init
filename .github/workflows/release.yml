name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Verify tag and package versions
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node dist/cli.js --version | awk '{print $2}')"
          package="$(node -p "require('./package.json').version")"
          test "$actual" = "$expected"
          test "$package" = "$expected"
      - name: Build release assets
        shell: bash
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          cp dist/cli.js release/repomemo.js
          chmod 0755 release/repomemo.js
          cd release
          sha256sum repomemo.js repomemo-*.tgz > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/repomemo.js
            release/repomemo-*.tgz
            release/SHA256SUMS
